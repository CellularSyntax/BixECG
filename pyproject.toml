[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bixecg"
version = "1.0.0"
description = "Compact, uncertainty-aware Bi-mLSTM model for real-time ECG waveform delineation on edge devices"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "David Lung" },
    { name = "Philipp Heute" },
    { name = "Manfred Marx" },
    { name = "Thomas Schlöglhofer" },
    { name = "Theodor Abart" },
    { name = "Francesco Moscato" },
    { name = "Julia Riebandt" },
    { name = "Daniel Zimpfer" },
    { name = "Max Haberbusch", email = "max.haberbusch@meduniwien.ac.at" },
]
maintainers = [
    { name = "Max Haberbusch", email = "max.haberbusch@meduniwien.ac.at" },
]
keywords = [
    "ECG",
    "electrocardiogram",
    "delineation",
    "waveform segmentation",
    "mLSTM",
    "xLSTM",
    "edge computing",
    "uncertainty quantification",
    "deep learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pillow>=9.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "torchinfo>=1.8",
    "tqdm>=4.65",
    "wfdb>=4.1",
    "optuna>=3.4",
    "tensorboard>=2.15",
    "xlstm==2.0.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/CellularSyntax/BixECG"
Repository = "https://github.com/CellularSyntax/BixECG"
Issues = "https://github.com/CellularSyntax/BixECG/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bixecg*"]

[tool.setuptools.package-data]
bixecg = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep CI lint advisory-friendly for a research codebase: syntax/runtime errors only.
select = ["E9", "F63", "F7", "F82"]
